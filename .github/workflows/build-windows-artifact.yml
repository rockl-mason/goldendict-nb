name: Build Windows Artifact

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - staged
      - main
      - master
    paths-ignore:
      - "docs/**"
      - "howto/**"
      - "*.md"
      - ".clang-format"
  pull_request:
    branches:
      - staged
      - main
      - master

jobs:
  build_windows:
    name: Build Windows x64
    permissions:
      contents: read
    runs-on: windows-2022
    env:
      QT_VERSION: 6.7.2
      ARTIFACT_PREFIX: goldendict-ng-${{ github.ref_name }}-${{ github.sha }}

    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.2.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          modules: qtwebengine qtwebchannel qtpositioning qt5compat qtmultimedia qtimageformats qtspeech

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure and build
        shell: powershell
        run: |
          & 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Launch-VsDevShell.ps1' `
            -SkipAutomaticLocation -Arch amd64 -HostArch amd64

          New-Item -Path './build_dir' -ItemType Directory -Force | Out-Null

          cmake -S . -B "./build_dir" `
            -G Ninja `
            -DCMAKE_C_COMPILER="cl.exe" `
            -DCMAKE_CXX_COMPILER="cl.exe" `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DWITH_FFMPEG_PLAYER=OFF `
            -DWITH_VCPKG_BREAKPAD=ON

          cmake --build "./build_dir" --config RelWithDebInfo

      - name: Package
        shell: powershell
        run: |
          Push-Location './build_dir'
          cpack --verbose --trace
          Pop-Location

      - name: Normalize artifact names
        shell: bash
        run: |
          set -euo pipefail

          package_base="$(basename "$(ls ./build_dir/*.7z | head -n 1)" .7z)"
          prefix="${ARTIFACT_PREFIX}"

          cp "./build_dir/goldendict/goldendict.exe" "./build_dir/${prefix}-portable.exe"
          mv "./build_dir/${package_base}.7z" "./build_dir/${prefix}-installer.7z"
          mv "./build_dir/${package_base}.exe" "./build_dir/${prefix}-installer.exe"

          portable_dir="./build_dir/${prefix}-portable"
          mkdir -p "${portable_dir}"
          cp -R ./build_dir/goldendict/. "${portable_dir}/"
          (
            cd ./build_dir
            7z a -tzip "${prefix}-portable.zip" "./${prefix}-portable/*"
          )

          if [ -f "./build_dir/goldendict/goldendict.pdb" ]; then
            mv "./build_dir/goldendict/goldendict.pdb" "./build_dir/${prefix}.pdb"
          fi

          ls -R ./build_dir

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ github.ref_name }}-qt${{ env.QT_VERSION }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ./build_dir/*-installer.exe
            ./build_dir/*-installer.7z
            ./build_dir/*-portable.zip
            ./build_dir/*-portable.exe
            ./build_dir/*.pdb

      - name: Write summary
        shell: bash
        run: |
          {
            echo "## Windows artifact ready"
            echo
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Qt: \`${QT_VERSION}\`"
            echo "- Download: Actions -> this run -> Artifacts"
            echo
            echo "### Files"
            ls ./build_dir/*-installer.exe ./build_dir/*-installer.7z ./build_dir/*-portable.zip ./build_dir/*-portable.exe ./build_dir/*.pdb 2>/dev/null | sed 's#^#- `#; s#$#`#'
          } >> "$GITHUB_STEP_SUMMARY"
